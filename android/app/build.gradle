plugins { id 'com.android.application' }

def releaseStore = System.getenv('RENKIO_STORE_FILE')
android {
 namespace 'com.renkio.game'
 compileSdk 36
 defaultConfig { applicationId 'com.renkio.game'; minSdk 26; targetSdk 36; versionCode 11401; versionName '1.14.1'; testInstrumentationRunner (project.findProperty('renkioQaRunner') ?: 'com.renkio.game.CrossplaySmoke') }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 signingConfigs {
  release {
   if (releaseStore) {
    storeFile file(releaseStore)
    storePassword System.getenv('RENKIO_STORE_PASSWORD')
    keyAlias System.getenv('RENKIO_KEY_ALIAS')
    keyPassword System.getenv('RENKIO_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { debuggable false; minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
}

tasks.register('bundleGameAssets', Sync) {
 from('../../public')
 into(layout.buildDirectory.dir('generated/gameAssets/game'))
 exclude('assets/renkio-hero.webp')
}
tasks.named('preBuild').configure { dependsOn 'bundleGameAssets' }

dependencies { implementation platform('com.google.firebase:firebase-bom:35.1.0'); implementation 'com.google.firebase:firebase-messaging'; implementation 'com.google.firebase:firebase-auth'; implementation 'androidx.credentials:credentials:1.3.0'; implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'; implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1' }


